<style>
/* VOICE: herramienta de campo, sobria y legible en tablet, a pie de vía.
   IDEA: el esquema de vía de ADIF — eje de PK, lado I/D, estaciones recuadradas en rojo como en la banda 0205.
   PICTURE: la propia línea Sants→Figueres dibujada como eje vertical con cada tramo PIDAME como bloque.
   COLOUR and TYPE: acero #d5dbe0, negro, blanco, rojo señal #e8251a; Inter Tight + Inter.
   LAYOUT: cabecera con buscador, pestañas Línea/Mapa/Tramos/Listado, ficha lateral (abajo en móvil). */
:root{color-scheme:light dark;--bg:light-dark(#eef1f3,#121518);--panel:light-dark(#fff,#1b1f23);--steel:light-dark(#d5dbe0,#2a3036);--ink:light-dark(#111417,#eef1f3);--mute:light-dark(#5b646c,#9aa4ad);--red:#e8251a;--line:light-dark(#c3cad0,#343b42);
--caseta:light-dark(#111417,#f2f4f6);--armario:#0b7a75;--tunel:#8a5a1c;--emp:#d9730d;--acc:#1f8a3b;--et:#e8251a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;margin:0;line-height:1.1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
header{background:var(--ink);color:var(--bg);padding:12px max(3vw,14px) 0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:22px;flex:1 1 260px}
.top h1 small{display:block;font:500 13px Inter;opacity:.7;margin-top:3px}
.sbar{display:flex;gap:8px;flex:1 1 380px}
.srch{position:relative;flex:1}
.gps{flex:none;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border:0;border-radius:8px;background:var(--red);color:#fff;font-weight:600}
.big{display:flex!important;justify-content:center;width:100%;min-height:52px!important;font-size:17px}
.acts a.wa{background:#1f8a3b;color:#fff}
.dtop{display:none}
.srch input{width:100%;height:44px;border-radius:8px;border:0;padding:0 14px;font-size:16px;background:var(--bg);color:var(--ink)}
.res{position:absolute;z-index:1200;top:48px;left:0;right:0;background:var(--panel);color:var(--ink);border-radius:8px;box-shadow:0 10px 30px #0006;max-height:60vh;overflow:auto;display:none}
.res button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:0;background:none;border-bottom:1px solid var(--line);min-height:44px}
.res button:hover,.res button:focus{background:var(--steel)}
nav.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav.tabs button{flex:none;border:0;background:none;color:inherit;opacity:.7;padding:10px 16px;min-height:44px;border-radius:8px 8px 0 0;font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px max(3vw,14px);border-bottom:1px solid var(--line);background:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:0 12px;min-height:36px;font-size:14px}
.chip[aria-pressed=false]{opacity:.45}
.chip .n{color:var(--mute);font-size:12px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.dot.caseta{background:var(--caseta);border-radius:2px}.dot.armario{background:var(--armario);border-radius:3px}.dot.tunel{background:var(--tunel)}.dot.emp{background:var(--emp);transform:rotate(45deg);border-radius:1px}.dot.acc{background:var(--acc);border-radius:2px 2px 6px 6px}.dot.et{border:2px solid var(--et);border-radius:1px;background:none}
main{flex:1;display:flex;min-height:0}
.view{flex:1;overflow:auto;min-height:0}
.view[hidden]{display:none}
#mapv{position:relative;overflow:hidden}
#map{position:absolute;inset:0;background:var(--steel)}
.mapnote{position:absolute;z-index:900;left:10px;bottom:10px;right:10px;max-width:460px;background:var(--panel);border-left:4px solid var(--red);padding:10px 12px;border-radius:6px;font-size:13px;box-shadow:0 4px 14px #0003}
/* line view */
.lv{max-width:1000px;margin:0 auto;padding:12px max(3vw,10px) 80px}
.tr{background:var(--panel);border-radius:10px;margin:0 0 10px;overflow:hidden;border:1px solid var(--line)}
.tr.est{border:2px solid var(--red)}
.trh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--steel)}
.trh h3{font-size:18px}
.trh .rg{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.trh .g{color:var(--mute);font-size:13px}
.trh .sp{flex:1}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--red);color:#fff;white-space:nowrap}
.badge.alt{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;min-height:40px;padding:0 12px;font-weight:600;font-size:14px}
.btn.pr{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rows{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr)}
.rw{display:contents}
.rw>div{padding:4px 8px;border-top:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.ax{text-align:center;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute);background:linear-gradient(90deg,transparent 44px,var(--ink) 44px,var(--ink) 48px,transparent 48px);display:flex;align-items:center;justify-content:center}
.ax span{background:var(--panel);padding:2px 4px;border-radius:4px}
.cell{display:flex;align-items:center}
.cell.l{justify-content:flex-end}
.it{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:6px 8px;border-radius:6px;min-height:40px;text-align:left;max-width:100%}
.cell.l .it{flex-direction:row-reverse;text-align:right}
.it:hover{background:var(--steel)}
.it b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.it small{display:block;color:var(--mute);font-size:12px}
.ax .em{display:inline-flex;gap:4px;align-items:center;border:0;background:var(--panel);font-weight:700;color:var(--emp);font-size:12px;padding:3px 6px;border-radius:6px;border:1px solid var(--emp)}
.empty{padding:10px 12px;color:var(--mute);font-size:13px}
.lgnd{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);padding:0 4px 6px;font-weight:600}
/* tables */
.tw{max-width:1240px;margin:0 auto;padding:14px max(3vw,10px) 80px}
table{border-collapse:collapse;width:100%;background:var(--panel);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--steel);font-size:13px;position:sticky;top:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.est td:first-child{border-left:4px solid var(--red)}
tr.grp td{background:var(--ink);color:var(--bg);font-weight:600;font-family:"Inter Tight"}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--steel)}
.sec{margin:22px 0 8px;font-size:20px}
.hint{color:var(--mute);font-size:13px;margin:4px 0 12px}
/* detail */
aside{width:380px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto;display:none;position:relative}
aside.on{display:block}
.dp{padding:16px 16px 30px}
.dp h2{font-size:24px;margin-right:44px;overflow-wrap:anywhere}
.dp .k{color:var(--mute);font-size:13px;margin-top:2px}
.x{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;background:none;font-size:26px;line-height:1}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:14px 0}
dt{color:var(--mute);font-size:13px}dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0}
.box.red{border:2px solid var(--red)}
.box h3{font-size:15px;margin-bottom:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.acts a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:8px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600}
.acts a.s{background:none;color:var(--ink);border:1px solid var(--line)}
.warn{background:color-mix(in srgb,var(--emp) 18%,var(--panel));border-left:4px solid var(--emp);padding:8px 10px;border-radius:6px;font-size:13px;margin:8px 0}
.near button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:8px 0;border-bottom:1px solid var(--line);min-height:44px;text-align:left}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:3000;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.form{display:grid;gap:8px;max-width:520px}
.form input{height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--panel);font-size:16px}

  const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'});
  osm.addTo(map);let te=0;[osm,sat].forEach(l=>l.on('tileerror',()=>{if(++te===4)$('#mapnote').hidden=false}));
  L.control.layers({'Callejero':osm,'Satélite':sat}).addTo(map);
  L.polyline(D.traza,{color:'#111417',weight:4}).addTo(map);
  (D.cam||[]).forEach(c=>L.polyline(c.line,{color:'#1f8a3b',weight:4,dashArray:'6 6'}).bindTooltip(c.named?c.name:'Camino de acceso').addTo(map));
  D.tun.forEach(t=>L.polyline(t.line,{color:'#8a5a1c',weight:8,opacity:.55}).bindTooltip('Túnel '+t.n).addTo(map));
  LG.tram=L.layerGroup().addTo(map);
  TR.forEach((t,i)=>{if(t.line.length>1&&t.bm>t.am)L.polyline(t.line,{color:t.est?'#e8251a':(i%2?'#5b8db8':'#9cc2e0'),weight:t.est?9:7,opacity:.85}).bindTooltip(`${t.n} · ${t.a} → ${t.b}`).on('click',()=>{tab('linea');document.getElementById('tr-'+t.n.replace(/\W/g,''))?.scrollIntoView()}).addTo(LG.tram)});
  // PK ticks every 5 km
  for(let k=625;k<=750;k+=5){const p=llAt(sOfPk(k*1000));L.marker(p,{icon:L.divIcon({className:'',html:`<span class="pkt">${k}</span>`,iconSize:null}),interactive:false}).addTo(LG.tram)}
  drawPts();setTimeout(()=>map.invalidateSize(),50)};
const drawPts=()=>{if(!map)return;Object.keys(COL).forEach(k=>{LG[k]&&map.removeLayer(LG[k]);LG[k]=L.layerGroup()});
  ITEMS.forEach(i=>{const m=L.circleMarker([i.lat,i.lon],{radius:i.k==='emp'?7:i.k==='tunel'?5:7,color:'#fff',weight:2,fillColor:COL[i.k],fillOpacity:1}).bindTooltip(`${i.name} · ${fmt(i.pm)}`).on('click',()=>show(i.id));m.addTo(LG[i.k])});
  Object.keys(COL).forEach(k=>ON[k]&&LG[k].addTo(map))};
const mapFocus=(it,zoom)=>{if(!map)return;hl&&map.removeLayer(hl);hl=L.circleMarker([it.lat,it.lon],{radius:16,color:'#e8251a',weight:3,fill:false}).addTo(map);if(zoom)map.setView([it.lat,it.lon],16)};
// ---------- search
const results=q=>{const out=[];const pm=parsePK(q);if(pm&&pm>=600000&&pm<=760000)out.push({pk:pm});const s=q.toLowerCase();if(s.length>=2)ITEMS.forEach(i=>{if((i.name+' '+i.sub+' '+(i.o.b||'')+' '+(i.o.h||'')).toLowerCase().includes(s))out.push({it:i})});TR.forEach((t,ix)=>{if(s.length>=3&&(t.n+' '+t.g).toLowerCase().includes(s))out.push({tr:ix})});return out.slice(0,30)};
const goPK=pm=>{const [la,lo]=llAt(sOfPk(pm));temp({id:'pk',k:'et',name:'PK '+fmt(pm),sub:'Punto buscado (posición estimada)',pm,lat:la,lon:lo,l:'',approx:true,o:{}})};
$('#q').addEventListener('input',()=>{const q=$('#q').value.trim(),r=$('#res');if(!q){r.style.display='none';return}const rs=results(q);
  r.innerHTML=rs.length?rs.map((x,n)=>x.pk?`<button data-n="${n}"><span class="pkchip">PK ${fmt(x.pk)}</span> Ver tramo PIDAME y elementos cercanos</button>`:x.tr!=null?`<button data-n="${n}"><span class="dot et"></span> Tramo ${esc(TR[x.tr].n)} · ${esc(TR[x.tr].a)}</button>`:`<button data-n="${n}"><span class="dot ${x.it.k}"></span><span>${esc(x.it.name)} <span class="lbl">· ${esc(x.it.sub)} · ${esc(fmt(x.it.pm))}</span></span></button>`).join(''):'<div class="empty">Sin resultados</div>';
  r.style.display='block';r._rs=rs});
$('#res').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const x=$('#res')._rs[+b.dataset.n];$('#res').style.display='none';
  if(x.pk)goPK(x.pk);else if(x.tr!=null){tab('linea');document.getElementById('tr-'+TR[x.tr].n.replace(/\W/g,''))?.scrollIntoView()}else show(x.it.id)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){$('#res').querySelector('button')?.click()}if(e.key==='Escape')$('#res').style.display='none'});
document.addEventListener('click',e=>{if(!e.target.closest('.srch'))$('#res').style.display='none'});
// ---------- tabs
const tab=v=>{document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));document.querySelectorAll('.view').forEach(s=>s.hidden=s.id!=='v-'+v);mapOn=v==='mapa';if(!mapOn&&v!=='linea')closeDet();if(mapOn){initMap();map&&setTimeout(()=>map.invalidateSize(),30)}try{localStorage.setItem('bafi_tab',v)}catch(e){}};
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('button');b&&tab(b.dataset.v)});
const refresh=()=>{build();chips();renderLine();renderTramos();renderList();renderAcc();drawPts()};
refresh();
let st='linea';try{st=localStorage.getItem('bafi_tab')||'linea'}catch(e){}tab(st);fromHash();
}
</script>
</body>
